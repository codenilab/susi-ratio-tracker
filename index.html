      '<div class="stat warn"><div class="num">' + underCount + '건</div><div class="label">경쟁률 1:1 미만</div></div>' +
      '<div class="stat"><div class="num">' + (topRow ? topRow.경쟁률.replace(" : ", ":") : "-") + '</div><div class="label">' +
        (topRow ? topRow.대학 + " · " + topRow.전형 : "최고 경쟁률") + '</div></div>';

    const groups = groupBySchool(rows).map((g) => ({ school: g.school, rows: g.rows.filter(matchesFilter) }));
    const visibleGroups = groups.filter((g) => g.rows.length > 0);

    if (visibleGroups.length === 0) {
      schoolsEl.innerHTML = '<div class="empty-note">검색 결과가 없습니다.</div>';
      return;
    }

    schoolsEl.innerHTML = visibleGroups
      .map((g) => {
        const deptNames = [...new Set(g.rows.map((r) => r.학과))].join(", ");
        const multiDept = deptNames.includes(",");
        const validRatios = g.rows.map((r) => parseRatio(r.경쟁률)).filter((v) => !isNaN(v));
        const avg = validRatios.length
          ? (validRatios.reduce((a, b) => a + b, 0) / validRatios.length).toFixed(2)
          : "-";

        const sortedRows = [...g.rows].sort((a, b) => {
          const bv = parseRatio(b.경쟁률), av = parseRatio(a.경쟁률);
          return (isNaN(bv) ? -1 : bv) - (isNaN(av) ? -1 : av);
        });

        const rowsHtml = sortedRows
          .map((r) => {
            const rv = parseRatio(r.경쟁률);
            const under = !isNaN(rv) && rv < 1;
            return (
              '<tr><td class="name">' + r.전형 + "</td>" +
              (multiDept ? '<td class="name">' + r.학과 + "</td>" : "") +
              '<td class="num">' + r.모집인원 + "</td>" +
              '<td class="num">' + r.지원인원 + "</td>" +
              '<td class="ratio num">' + r.경쟁률 + (under ? '<span class="chip">미달</span>' : "") + "</td></tr>"
            );
          })
          .join("");

        const colgroup = multiDept
          ? '<colgroup><col><col class="col-dept"><col class="col-num"><col class="col-num"><col class="col-ratio"></colgroup>'
          : '<colgroup><col><col class="col-num"><col class="col-num"><col class="col-ratio"></colgroup>';

        const sourceUrl = g.rows[0] && g.rows[0].원본URL;

        return (
          '<section class="school">' +
            '<div class="school-head">' +
              "<h2>" + g.school + '<span class="dept">' + deptNames + "</span>" +
                (sourceUrl
                  ? '<a class="src-link" href="' + escapeAttr(sourceUrl) + '" target="_blank" rel="noopener noreferrer">원본 경쟁률 페이지 ↗</a>'
                  : "") +
              "</h2>" +
              '<span class="avg">평균 ' + avg + " : 1 · " + g.rows.length + "건</span>" +
            "</div>" +
            '<div class="table-scroll"><table>' + colgroup + '<thead><tr>' +
              '<th class="name">전형</th>' + (multiDept ? '<th class="name">학과</th>' : "") +
              '<th class="num">모집</th><th class="num">지원</th><th class="num">경쟁률</th>' +
            "</tr></thead><tbody>" + rowsHtml + "</tbody></table></div>" +
          "</section>"
        );
      })
      .join("");
  }

  document.getElementById("searchInput").addEventListener("input", (e) => {
    filterText = e.target.value.trim().toLowerCase();
    render();
  });

  render();
  // 페이지를 열어둔 채로 있어도 "n분 전" 표시가 계속 최신으로 갱신되도록 함
  setInterval(updateClock, 30000);
</script>

</body>
</html>
